        name: { type: string }
        summary: { type: string }
        starts_at: { type: string }
        ends_at: { type: string }
        location: { type: string }
        price_text: { type: string }
        registration_url: { type: string }
        status: { type: string }
        public_description: { type: string, description: "HTML." }
        category: { type: string, description: "Slug de catégorie (GET /event_categories)." }
        event_category_id: { type: integer }
        team_id: { type: integer }
        slug: { type: string }
        published: { type: boolean }
        image_url: { type: string }
        remove_image: { type: boolean }
