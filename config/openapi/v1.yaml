      requestBody: { $ref: "#/components/requestBodies/WriteBody" }
      responses:
        "200":
          description: Cycle mis à jour.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Cycle" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
