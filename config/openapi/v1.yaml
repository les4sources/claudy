        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Collectif]
      summary: Détail d'un cycle
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Cycle.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Cycle" } }
