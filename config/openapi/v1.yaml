    CatalogPrice:
      type: object
      description: >
        Palier de prix daté. Les périodes [active_from, active_until] sont bornes
        incluses, ne se chevauchent jamais, et active_until vide signifie
        « jusqu'à nouvel ordre ». Les quatre prix sont STOCKÉS, jamais recalculés
        à la lecture : relever une marge demain ne doit pas déplacer un décompte
        déjà émis.
      properties:
        id: { type: integer }
        type: { type: string, example: catalog_price }
        catalog_item_id: { type: integer }
        active_from: { type: string, format: date }
        active_until: { type: string, format: date, nullable: true }
        open_ended: { type: boolean }
        current: { type: boolean, description: "Le palier couvre-t-il la date du jour ?" }
        member_price: { $ref: "#/components/schemas/Money" }
        purchase_price: { $ref: "#/components/schemas/Money" }
        reference_price: { $ref: "#/components/schemas/Money" }
        public_price: { $ref: "#/components/schemas/Money" }
        note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CatalogItem:
      type: object
      description: >
        Article du bar, du cellier ou des repas. L'article ne porte pas de prix :
        il a des paliers datés. `price` est celui qui couvre la date `on` de la
        requête ; `prices` (détail seulement) donne tout l'historique.
      properties:
        id: { type: integer }
        type: { type: string, example: catalog_item }
        name: { type: string, example: "Taras Boulba" }
        channel: { type: string, enum: [bar, grocery, meal] }
        channel_label: { type: string, example: "Bar" }
        category: { type: string, nullable: true, example: "Bières" }
        unit: { type: string, enum: [piece, kg, l, portion, day] }
        unit_label: { type: string, example: "pièce" }
        reference: { type: string, nullable: true }
        active: { type: boolean }
        price_on: { type: string, format: date }
        price:
          allOf: [{ $ref: "#/components/schemas/CatalogPrice" }]
          nullable: true
          description: "Palier couvrant `price_on`, ou null si l'article n'est pas tarifé à cette date."
        prices:
          type: array
          description: "Historique complet des paliers (endpoint de détail uniquement)."
          items: { $ref: "#/components/schemas/CatalogPrice" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        url: { type: string, format: uri }
    MemberAccount:
      type: object
      description: >
        Compte courant interne, ancré sur exactement une chose : un ménage, une
        personne, ou rien (entité). Le solde n'est pas une colonne — il vaut
        toujours solde d'ouverture + somme des écritures.
      properties:
        id: { type: integer }
        type: { type: string, example: member_account }
        code: { type: string, example: "SRC-0001" }
        name: { type: string, example: "Ménage Alpha" }
        kind: { type: string, enum: [household, human, entity] }
        kind_label: { type: string, example: "Ménage" }
        active: { type: boolean }
        household_id: { type: integer, nullable: true }
        human_id: { type: integer, nullable: true }
        contact_email: { type: string, nullable: true }
        opening_balance: { $ref: "#/components/schemas/Money" }
        balance_cents: { type: integer, description: "Positif = dû par le compte." }
        balance_formatted: { type: string }
        entries_count: { type: integer }
        last_entry_on: { type: string, format: date, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        url: { type: string, format: uri }
    PaperSheet:
      type: object
      description: >
        Fiche papier d'un mois et d'un canal. Les écritures qui en naissent sont
        datées de `entry_date`, le dernier jour du mois — c'est ce qui les fait
        tomber dans le bon décompte.
      properties:
        id: { type: integer }
        type: { type: string, example: paper_sheet }
        period_month: { type: string, format: date, example: "2026-07-01" }
        entry_date: { type: string, format: date, example: "2026-07-31" }
        channel: { type: string, enum: [bar, grocery, meal] }
        channel_label: { type: string }
        status: { type: string, enum: [open, encoded, archived] }
        status_label: { type: string }
        entry_mode: { type: string, enum: [quantity, amount] }
        member_account_id: { type: integer, nullable: true }
        notes: { type: string, nullable: true }
        encoded_at: { type: string, format: date-time, nullable: true }
        total_cents: { type: integer }
        total_formatted: { type: string }
        totals_by_account:
          type: array
          description: "Répartition du total par compte — de quoi vérifier un encodage sans relire les écritures."
          items:
            type: object
            properties:
              member_account_id: { type: integer }
              name: { type: string }
              code: { type: string }
              entries: { type: integer }
              cents: { type: integer }
              formatted: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        url: { type: string, format: uri }
    # ── Carte du domaine et plantes (epic #348, phase 8) ──────────────────────
    # Listes fermées. En ÉCRITURE, la clé OU le libellé de la base Notion
    # (« Existante », « Arbre », casse ignorée) sont acceptés ; en lecture, c'est
    # toujours la clé.
    PlantStatus:
      type: string
      enum: [existing, to_confirm, to_place, on_plan, awaiting_planting, planted, dead, to_move, wild]
      description: "Existante, À confirmer, À placer, Sur plan, En attente de plantation, Plantée, Morte, À déplacer, Flore sauvage."
    PlantHealth:
      type: string
      enum: [healthy, worrying, sick]
      description: "Saine, Inquiétante, Malade."
    PlantProduction:
      type: string
      enum: [high, medium, low, none]
      description: "Élevée, Moyenne, Faible, Ne produit pas."
    PlantHabit:
      type: string
      enum: [standard, half_standard, dwarf]
      description: "Haute tige, Moyenne tige, Basse tige."
    PlantStratum:
      type: string
      enum: [tree, coppice, pollard, food_pollard, espalier, shrub, subshrub, herbaceous, climber, groundcover, vine, aquatic]
      description: "Arbre, Arbre en cépée, Arbre trogné, Trogne alimentaire, Palissé, Arbuste, Arbrisseau, Herbacée, Grimpante, Couvre-sol, Liane, Aquatique."
    PlantPopulation:
      type: string
      enum: [strong, medium, rare, single]
      description: "Forte population, Moyenne, Rare, Un seul individu."
    PlantStockType:
      type: string
      enum: [container, bare_root, b2b, forest_plug]
      description: "Conteneur, Racines nues, B2B, Mini-motte forestière."
    HarvestPart:
      type: string
      enum: [flower, leaf, fruit, root, seed, sap, other]
      description: "Fleur, Feuille, Fruit, Racine, Graine, Sève, Autre."
    MapFeatureKind:
      type: string
      enum: [zone, path, point, plant, node, line, comment, observation, lodging, space]
    MapLayerKind:
      type: string
      enum: [venues, management, welcome, plants, network, comments, sketch, biodiversity]
      description: "network et sketch ont plusieurs couches : les désigner par layer_id."
    MapTaskSector:
      type: string
      enum: [terrain, nourricier]
    MapSubjectType:
      type: string
      enum: [MapFeature, Plant]
    HarvestWindow:
      type: object
      properties:
        part: { $ref: "#/components/schemas/HarvestPart" }
        part_label: { type: string, example: "Fruit" }
        months: { type: array, items: { type: integer, minimum: 1, maximum: 12 }, example: [9, 10] }
    HarvestWindowInput:
      type: object
      required: [part, months]
      properties:
        part: { type: string, description: "Clé de HarvestPart ou son libellé (« Fruit »).", example: "fruit" }
        months: { type: array, items: { type: integer, minimum: 1, maximum: 12 }, example: [9, 10] }
    PlantSpecies:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, example: "plant_species" }
        name: { type: string, example: "Pommier" }
        latin_name: { type: string, nullable: true, example: "Malus domestica" }
        full_name: { type: string, example: "Pommier (Malus domestica)" }
        family: { type: string, nullable: true, example: "Rosaceae" }
        common_names: { type: string, nullable: true }
        hardiness: { type: string, nullable: true }
        height: { type: string, nullable: true }
        spread: { type: string, nullable: true }
        exposure: { type: array, items: { type: string } }
        edible_parts: { type: array, items: { type: string } }
        wikipedia_url: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        harvest_windows:
          type: array
          description: Fenêtres de récolte PAR DÉFAUT, héritées par les plantes qui n'en ont pas en propre.
          items: { $ref: "#/components/schemas/HarvestWindow" }
        varieties:
          type: array
          items: { type: object, properties: { id: { type: integer }, name: { type: string } } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PlantSpeciesInput:
      type: object
      properties:
        name: { type: string, description: "Obligatoire à la création. Clé de l'upsert (casse ignorée).", example: "Pommier" }
        latin_name: { type: string, example: "Malus domestica" }
        family: { type: string }
        common_names: { type: string }
        hardiness: { type: string }
        height: { type: string }
        spread: { type: string }
        exposure: { type: array, items: { type: string } }
        edible_parts: { type: array, items: { type: string } }
        wikipedia_url: { type: string }
        notes: { type: string }
        harvest_windows:
          type: array
          description: Remplace les fenêtres par défaut. Absent = inchangées ; liste vide = aucune.
          items: { $ref: "#/components/schemas/HarvestWindowInput" }
    PlantVariety:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, example: "plant_variety" }
        name: { type: string, example: "Reinette Hernaut" }
        full_name: { type: string, example: "Pommier Reinette Hernaut" }
        notes: { type: string, nullable: true }
        plant_species_id: { type: integer }
        species: { $ref: "#/components/schemas/PlantSpeciesRef" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PlantSpeciesRef:
      type: object
      nullable: true
      properties:
        id: { type: integer }
        name: { type: string, example: "Pommier" }
        latin_name: { type: string, nullable: true, example: "Malus domestica" }
    Plant:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, example: "plant" }
        name: { type: string, example: "Pommier Reinette Hernaut cl" }
        display_name: { type: string }
        number: { type: number, nullable: true, example: 9.1, description: "Numéro de terrain, décimal (9.1 existe)." }
        number_label: { type: string, nullable: true, example: "9.1" }
        status: { $ref: "#/components/schemas/PlantStatus" }
        status_label: { type: string, example: "Existante" }
        health: { $ref: "#/components/schemas/PlantHealth" }
        production: { $ref: "#/components/schemas/PlantProduction" }
        habit: { $ref: "#/components/schemas/PlantHabit" }
        stratum: { $ref: "#/components/schemas/PlantStratum" }
        population: { $ref: "#/components/schemas/PlantPopulation" }
        stock_type: { $ref: "#/components/schemas/PlantStockType" }
        zone: { type: string, nullable: true, example: "Verger" }
        plant_count: { type: integer, nullable: true }
        purchase_price_cents: { type: integer, nullable: true }
        planted_on: { type: string, format: date, nullable: true }
        planted_year: { type: integer, nullable: true }
        altitude: { type: integer, nullable: true }
        nursery: { type: string, nullable: true }
        notion_url: { type: string, nullable: true }
        notes: { type: string, nullable: true, description: "Texte libre de la fiche. Les notes datées sont dans `notes_log` (fiche détaillée)." }
        placed: { type: boolean, description: "true = un point sur la carte ; false = « à placer »." }
        latitude: { type: number, nullable: true, example: 50.3312 }
        longitude: { type: number, nullable: true, example: 4.8765 }
        map_feature_id: { type: integer, nullable: true }
        species: { $ref: "#/components/schemas/PlantSpeciesRef" }
        variety:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
            plant_species_id: { type: integer }
        harvest_windows:
          type: array
          description: Les fenêtres PROPRES de la plante.
          items: { $ref: "#/components/schemas/HarvestWindow" }
        harvest_windows_inherited: { type: boolean, description: "true si la plante n'a pas de fenêtre propre et hérite de son espèce." }
        harvest_windows_effective:
          type: array
          description: Les fenêtres qui s'appliquent — propres si elle en a, sinon celles de l'espèce.
          items:
            allOf:
              - $ref: "#/components/schemas/HarvestWindow"
              - type: object
                properties:
                  inherited: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PlantDetail:
      allOf:
        - $ref: "#/components/schemas/Plant"
        - type: object
          properties:
            notes_log: { type: array, items: { $ref: "#/components/schemas/MapNote" } }
            photos: { type: array, items: { $ref: "#/components/schemas/Photo" } }
            tasks: { type: array, items: { $ref: "#/components/schemas/MapTask" } }
    PlantInput:
      type: object
      description: >
        Tous les champs sont facultatifs ; sans `name`, la plante prend « espèce
        variété ». Les listes fermées acceptent la clé ou le libellé Notion.
      properties:
        name: { type: string }
        number: { oneOf: [{ type: number }, { type: string }], example: 9.1, description: "Unique parmi les plantes vivantes ; doublon → 422." }
        species_name: { type: string, example: "Pommier", description: "Résolu par nom (casse ignorée), créé au besoin." }
        species_latin_name: { type: string, example: "Malus domestica", description: "Posé seulement si l'espèce est créée." }
        plant_species_id: { type: integer }
        variety_name: { type: string, example: "Reinette Hernaut", description: "Variété de l'espèce donnée (ou actuelle), créée au besoin." }
        plant_variety_id: { type: integer }
        status: { type: string, description: "Clé de PlantStatus ou libellé." }
        health: { type: string, description: "Clé de PlantHealth ou libellé." }
        production: { type: string, description: "Clé de PlantProduction ou libellé." }
        habit: { type: string, description: "Clé de PlantHabit ou libellé." }
        stratum: { type: string, description: "Clé de PlantStratum ou libellé." }
        population: { type: string, description: "Clé de PlantPopulation ou libellé." }
        stock_type: { type: string, description: "Clé de PlantStockType ou libellé." }
        zone: { type: string }
        plant_count: { type: integer }
        purchase_price_cents: { type: integer }
        planted_on: { type: string, format: date }
        planted_year: { type: integer }
        altitude: { type: integer }
        nursery: { type: string }
        notion_url: { type: string, description: "Clé de l'upsert de POST /plants." }
        notes: { type: string }
        latitude: { type: number, description: "Avec longitude (WGS84) : place ou déplace la plante." }
        longitude: { type: number }
        placed: { type: boolean, description: "false retire la plante de la carte (elle redevient « à placer »)." }
        harvest_windows:
          type: array
          description: Remplace les fenêtres propres. Absent = inchangées ; liste vide = retour à l'héritage de l'espèce.
          items: { $ref: "#/components/schemas/HarvestWindowInput" }
      example:
        name: "Pommier Reinette Hernaut cl"
        number: 9.1
        species_name: "Pommier"
        species_latin_name: "Malus domestica"
        variety_name: "Reinette Hernaut"
        status: "Existante"
        stratum: "Arbre"
        zone: "Verger"
        notion_url: "https://www.notion.so/…"
        latitude: 50.3312
        longitude: 4.8765
        harvest_windows: [{ part: "fruit", months: [9, 10] }]
    MapNote:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, example: "map_note" }
        subject_type: { $ref: "#/components/schemas/MapSubjectType" }
        subject_id: { type: integer }
        body: { type: string, example: "Bourgeons gelés" }
        noted_on: { type: string, format: date }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Photo:
      type: object
      properties:
        id: { type: integer, description: "Identifiant de la pièce jointe (pour DELETE …/photos/{id})." }
        filename: { type: string, example: "pommier.jpg" }
        content_type: { type: string, example: "image/jpeg" }
        byte_size: { type: integer }
        url: { type: string, format: uri }
        created_at: { type: string, format: date-time }
    MapTask:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, example: "map_task" }
        subject_type: { $ref: "#/components/schemas/MapSubjectType" }
        subject_id: { type: integer }
        label: { type: string, example: "Taille d'hiver" }
        months: { type: array, items: { type: integer, minimum: 1, maximum: 12 } }
        sector: { $ref: "#/components/schemas/MapTaskSector" }
        sector_label: { type: string }
        frequency: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        position: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MapTaskInput:
      type: object
      properties:
        label: { type: string }
        months: { type: array, items: { type: integer, minimum: 1, maximum: 12 } }
        sector: { type: string, description: "Clé de MapTaskSector ou libellé. Par défaut : terrain pour un objet, nourricier pour une plante." }
        frequency: { type: string }
        notes: { type: string }
    MapFeature:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, example: "map_feature" }
        feature_kind: { $ref: "#/components/schemas/MapFeatureKind" }
        layer_id: { type: integer }
        layer_kind: { $ref: "#/components/schemas/MapLayerKind" }
        name: { type: string, nullable: true, description: "Nom affiché (français, sinon lieux ou plante)." }
        name_i18n: { type: object, additionalProperties: { type: string }, example: { fr: "Prairie du bas" } }
        description_i18n: { type: object, additionalProperties: { type: string } }
        geometry: { $ref: "#/components/schemas/GeoJSONGeometry" }
        geometry_type: { type: string, enum: [Point, LineString, Polygon] }
        properties: { type: object, additionalProperties: true, example: { management_notes: "Fauche tardive" } }
        position: { type: integer }
        plant_id: { type: integer, nullable: true, description: "La plante que ce point représente (feature_kind plant)." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MapFeatureDetail:
      allOf:
        - $ref: "#/components/schemas/MapFeature"
        - type: object
          properties:
            notes_log: { type: array, items: { $ref: "#/components/schemas/MapNote" } }
            photos: { type: array, items: { $ref: "#/components/schemas/Photo" } }
            tasks: { type: array, items: { $ref: "#/components/schemas/MapTask" } }
    MapFeatureInput:
      type: object
      properties:
        layer_id: { type: integer }
        layer_kind: { type: string, description: "Clé de MapLayerKind (couches uniques seulement)." }
        feature_kind: { type: string, description: "Clé de MapFeatureKind, sauf plant. Déduit de la géométrie si absent." }
        geometry: { $ref: "#/components/schemas/GeoJSONGeometry" }
        name_i18n: { type: object, additionalProperties: { type: string }, description: "Clés fr, en, nl." }
        description_i18n: { type: object, additionalProperties: { type: string } }
        properties: { type: object, additionalProperties: true }
        position: { type: integer }
    GeoJSONGeometry:
      type: object
      description: "GeoJSON Point, LineString ou Polygon, positions en [longitude, latitude] (WGS84)."
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Point, LineString, Polygon] }
        coordinates: { type: array, items: {} }
      example: { type: Point, coordinates: [4.8765, 50.3312] }
