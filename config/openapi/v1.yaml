              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/SpaceBooking" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [Réservations]
      summary: Supprimer une réservation d'espace (soft-delete)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Réservations]
      summary: Détail d'une réservation d'espace
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Réservation d'espace.
          content:
            application/json:
              schema:
