                    color: { type: string, description: "#rrggbb" }
                    pole: { type: string, enum: [hebergement, convivialite, nature, artisanat, ressourcement, vie-collective, production] }
      responses:
        "200":
          description: Catégorie mise à jour.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/EventCategory" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
