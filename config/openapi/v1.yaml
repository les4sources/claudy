  /events:
    get:
      tags: [Événements]
      summary: Lister les événements (brouillons compris)
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: "Événements qui se terminent à cette date ou après." }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Événements qui commencent à cette date ou avant." }
        - { name: published, in: query, schema: { type: boolean }, description: "true = publiés sur le site, false = brouillons." }
        - { name: category, in: query, schema: { type: string }, description: "Slug de catégorie." }
        - { name: slug, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: "Recherche insensible à la casse dans le nom." }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Liste paginée, du plus tôt au plus tard.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Event" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      tags: [Événements]
      summary: Créer ou mettre à jour un événement (upsert sur le slug)
      description: >
        Quand un événement vivant porte déjà le `slug` fourni, il est MIS À JOUR
        au lieu qu'un second soit créé, et `meta.created` dit lequel des deux
        s'est produit. Le slug est l'adresse de la fiche sur le site
        (/evenements/<slug>) : il est figé tant que l'événement est publié.
        Pour publier un brouillon créé dans l'admin, le retrouver (GET avec
        from/to/q) puis PATCH `published: true` — plutôt qu'un POST qui en
        créerait un second.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event: { $ref: "#/components/schemas/EventWrite" }
      responses:
        "201":
          description: Événement créé (`meta.created` vaut true).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Event" }
                  meta: { type: object, properties: { created: { type: boolean } } }
        "200":
          description: Événement retrouvé sur son slug et mis à jour (`meta.created` vaut false).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Event" }
                  meta: { type: object, properties: { created: { type: boolean } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /events/{id}:
    get:
      tags: [Événements]
      summary: Détail d'un événement
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Événement.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Event" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Événements]
      summary: Éditer, publier ou dépublier un événement
      description: "Mêmes champs que la création. `published: false` retire la fiche du site mais garde le slug."
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event: { $ref: "#/components/schemas/EventWrite" }
      responses:
        "200":
          description: Événement mis à jour.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Event" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [Événements]
      summary: Mettre un événement à la corbeille (soft-delete)
      description: "La ligne reste en base, `deleted_at` renseignée. Le slug reste réservé."
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /event_categories:
    get:
      tags: [Événements]
      summary: Lister les catégories d'événements et leur pôle
      responses:
        "200":
          description: Toutes les catégories, par nom.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/EventCategory" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Événements]
      summary: Créer une catégorie (upsert sur le slug)
      description: >
        Le slug vient de `slug` s'il est fourni, sinon du nom. Quand une
        catégorie porte déjà ce slug, elle est MISE À JOUR (`meta.created`
        vaut false) au lieu qu'une seconde soit créée. Le slug ne change plus
        ensuite : le site s'en sert comme clé.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_category]
              properties:
                event_category:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string }
                    slug: { type: string }
                    color: { type: string, description: "#rrggbb ; teal de la charte par défaut." }
                    pole: { type: string, enum: [hebergement, convivialite, nature, artisanat, ressourcement, vie-collective, production] }
      responses:
        "201":
          description: Catégorie créée (`meta.created` vaut true).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/EventCategory" }
                  meta: { type: object, properties: { created: { type: boolean } } }
        "200":
          description: Catégorie retrouvée sur son slug et mise à jour.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/EventCategory" }
                  meta: { type: object, properties: { created: { type: boolean } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /event_categories/{id}:
    patch:
      tags: [Événements]
      summary: Poser le pôle (ou le nom, la couleur) d'une catégorie
      description: "Le slug est la clé du site et n'est pas modifiable."
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
