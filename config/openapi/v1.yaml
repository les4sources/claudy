          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Space" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /spaces/{id}:
    patch:
      tags: [Catalogue]
      summary: Éditer un espace
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { $ref: "#/components/requestBodies/WriteBody" }
      responses:
        "200":
          description: Espace mis à jour.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Space" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
