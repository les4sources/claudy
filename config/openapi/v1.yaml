        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Collectif]
      summary: Détail d'un membre
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Membre.
          content:
            application/json:
