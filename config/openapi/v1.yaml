        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Catalogue]
      summary: Détail d'un espace
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Espace.
          content:
            application/json:
              schema:
