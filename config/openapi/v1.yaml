        - { name: active, in: query, schema: { type: boolean }, description: "true pour n'obtenir que les articles actifs." }
        - { $ref: "#/components/parameters/PriceOn" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Liste paginée d'articles, chacun avec le palier de prix qui couvre `on`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/CatalogItem" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Bar & comptes internes]
      summary: Créer un article (upsert sur canal + nom)
      description: >
        Reposter le même couple (channel, name) met l'article à jour au lieu d'en
        créer un second. `meta.created` vaut true si l'article a été créé, false
        s'il existait déjà. Le prix ne se pose pas ici mais via
        POST /catalog_items/{id}/prices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                catalog_item:
                  type: object
                  required: [name, channel]
                  properties:
                    name: { type: string, example: "Taras Boulba" }
                    channel: { type: string, enum: [bar, grocery, meal] }
                    category: { type: string, example: "Bières" }
                    unit: { type: string, enum: [piece, kg, l, portion, day] }
                    reference: { type: string, nullable: true }
                    active: { type: boolean }
      responses:
        "201":
          description: Article créé.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/CatalogItem" }
                  meta: { type: object, properties: { created: { type: boolean, example: true } } }
        "200":
          description: Article déjà existant, mis à jour.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/CatalogItem" }
                  meta: { type: object, properties: { created: { type: boolean, example: false } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /catalog_items/{id}:
    get:
      tags: [Bar & comptes internes]
      summary: Détail d'un article, avec tout l'historique de ses paliers
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/PriceOn" }
      responses:
        "200":
          description: Article et ses paliers, du plus récent au plus ancien.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/CatalogItem" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Bar & comptes internes]
      summary: Éditer un article
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { $ref: "#/components/requestBodies/WriteBody" }
      responses:
        "200":
          description: Article mis à jour.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/CatalogItem" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [Bar & comptes internes]
      summary: Retirer un article (soft-delete)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /catalog_items/{catalog_item_id}/prices:
    get:
      tags: [Bar & comptes internes]
      summary: Paliers de prix d'un article
      parameters: [{ $ref: "#/components/parameters/CatalogItemId" }]
      responses:
        "200":
          description: Paliers, du plus récent au plus ancien.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/CatalogPrice" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Bar & comptes internes]
      summary: Poser un palier de prix
      description: >
        Les périodes ne peuvent pas se chevaucher : poser un palier sur une période
        déjà couverte répond 422 plutôt que d'écraser en silence. Pour corriger un
        palier existant, le viser en PATCH. Seul `member_price_cents` est
        obligatoire — le prix d'achat manque parfois (don, récupération) et le prix
        public n'existe pas pour un article qui n'est pas vendu au public.
      parameters: [{ $ref: "#/components/parameters/CatalogItemId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                price:
                  type: object
                  required: [active_from, member_price_cents]
                  properties:
                    active_from: { type: string, format: date }
                    active_until: { type: string, format: date, nullable: true, description: "Vide = jusqu'à nouvel ordre." }
                    member_price_cents: { type: integer, example: 138 }
                    purchase_price_cents: { type: integer, nullable: true, example: 125 }
                    reference_price_cents: { type: integer, nullable: true }
                    public_price_cents: { type: integer, nullable: true, example: 300 }
                    note: { type: string, nullable: true }
      responses:
        "201":
          description: Palier créé.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/CatalogPrice" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /catalog_items/{catalog_item_id}/prices/{id}:
    patch:
      tags: [Bar & comptes internes]
      summary: Corriger un palier de prix
      parameters:
        - { $ref: "#/components/parameters/CatalogItemId" }
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                price: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Palier mis à jour.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/CatalogPrice" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [Bar & comptes internes]
      summary: Supprimer un palier de prix
      parameters:
        - { $ref: "#/components/parameters/CatalogItemId" }
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /member_accounts:
    get:
      tags: [Bar & comptes internes]
      summary: Lister les comptes courants internes
      description: >
        Lecture seule — un compte s'ouvre et se ferme dans l'app. Sert notamment à
        résoudre « nom de famille → identifiant de compte » avant d'encoder une fiche.
        Le solde n'est jamais stocké : il est recalculé depuis les écritures.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Recherche sur le nom du compte." }
        - { name: kind, in: query, schema: { type: string, enum: [household, human, entity] } }
        - { name: active, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Liste paginée de comptes, avec solde et nombre d'écritures.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MemberAccount" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Bar & comptes internes]
      summary: Créer (ou retrouver) un compte courant
      description: >
        UPSERT sur le NOM. Reposter le même nom renvoie le compte existant en 200
        au lieu d'en créer un second : deux comptes portant le même nom rendraient
        tout recoupement de total impossible. Le code SRC-xxxx est attribué par
        l'application. `meta.created` dit lequel des deux s'est produit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [member_account]
              properties:
                member_account:
                  type: object
                  required: [name, kind]
                  properties:
                    name: { type: string }
                    kind: { type: string, enum: [household, human, entity] }
                    contact_email: { type: string }
                    active: { type: boolean }
                    opening_balance_cents: { type: integer }
                    opening_balance_on: { type: string, format: date }
                    household_id: { type: integer }
                    human_id: { type: integer }
      responses:
        "201":
          description: Compte créé.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/MemberAccount" } }
        "200": { description: Compte existant retrouvé sur le nom. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /member_accounts/{id}:
    get:
      tags: [Bar & comptes internes]
      summary: Détail d'un compte courant
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Compte.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/MemberAccount" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Bar & comptes internes]
      summary: Modifier un compte courant
      description: >
        Sert notamment à clore le compte d'un ménage parti (`active: false`) sans
        perdre son historique.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                member_account:
                  type: object
                  properties:
                    name: { type: string }
                    kind: { type: string, enum: [household, human, entity] }
                    contact_email: { type: string }
                    active: { type: boolean }
                    opening_balance_cents: { type: integer }
                    opening_balance_on: { type: string, format: date }
      responses:
        "200": { description: Compte mis à jour. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /member_accounts/{member_account_id}/settlements:
    get:
      tags: [Bar & comptes internes]
      summary: Lister les règlements reçus sur un compte
      parameters:
        - { name: member_account_id, in: path, required: true, schema: { type: integer } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200": { description: Liste paginée de règlements. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Bar & comptes internes]
      summary: Enregistrer un règlement reçu
      description: >
        Passe par le même service que l'écran : UN règlement = UNE écriture
        négative + UN règlement qui la documente. `reference` sert de clé
        d'idempotence sur le compte — reposter la même référence renvoie
        l'existant en 200 au lieu d'encaisser deux fois.
      parameters:
        - { name: member_account_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_settlement]
              properties:
                account_settlement:
                  type: object
                  required: [amount_cents, received_on]
                  properties:
                    amount_cents: { type: integer, description: "Montant positif, en centimes." }
                    received_on: { type: string, format: date }
                    method: { type: string, enum: [cash, bank_transfer, compensation] }
                    received_channel: { type: string, enum: [bank, bar_box, grocery_box, hand] }
                    reference: { type: string }
                    notes: { type: string }
      responses:
        "201": { description: Règlement enregistré. }
        "200": { description: Règlement déjà enregistré sous cette référence. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /account_entries:
    get:
      tags: [Bar & comptes internes]
      summary: Lister les écritures de compte courant
      parameters:
        - { name: member_account_id, in: query, schema: { type: integer } }
        - { name: flow, in: query, schema: { type: string, enum: [bar, grocery, meal, pot, dome, pet, charges, other] } }
        - { name: source, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200": { description: Liste paginée d'écritures, dans l'ordre chronologique. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Bar & comptes internes]
      summary: Créer une écriture de compte courant
      description: >
        Pour tout ce qui n'est pas une fiche papier : charges habitants, loyer,
        pension, location du dôme, forfaits, arrondis de reprise. Avec
        `idempotency_key`, POST est un UPSERT — rejouer un import met à jour
        l'écriture au lieu d'en créer une seconde. Une écriture rattachée à un
        décompte émis sort en 409 : la correction passe par une contre-écriture.
        Le solde du compte après écriture est renvoyé dans `meta`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_entry]
              properties:
                account_entry:
                  type: object
                  required: [member_account_id, entry_date, amount_cents]
                  properties:
                    member_account_id: { type: integer }
                    entry_date: { type: string, format: date }
                    amount_cents: { type: integer, description: "Signé : positif = dû par le compte, négatif = en sa faveur. Zéro refusé." }
                    label: { type: string }
                    flow: { type: string, enum: [bar, grocery, meal, pot, dome, pet, charges, other] }
                    kind: { type: string }
                    source: { type: string }
                    idempotency_key: { type: string }
                    quantity: { type: number }
                    unit_price_cents: { type: integer }
                    catalog_item_id: { type: integer }
      responses:
        "201": { description: Écriture créée. }
        "200": { description: Écriture retrouvée sur sa clé d'idempotence et mise à jour. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: "Écriture verrouillée par un décompte émis." }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /account_entries/{id}:
    get:
      tags: [Bar & comptes internes]
      summary: Détail d'une écriture
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Écriture. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /general_accounts:
    get:
      tags: [Comptabilité]
      summary: Lister le plan comptable général
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: klass, in: query, schema: { type: integer, minimum: 1, maximum: 7 } }
        - { name: nature, in: query, schema: { type: string, enum: [asset, liability, equity, revenue, expense] } }
        - { name: active, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200": { description: Liste paginée de comptes généraux. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Comptabilité]
      summary: Créer (ou retrouver) un compte général
      description: >
        UPSERT sur le CODE — deux comptes portant le même numéro rendraient toute
        balance ininterprétable. `klass` et `nature` se déduisent du numéro
        (PCMN) quand ils ne sont pas fournis ; une valeur explicite l'emporte
        toujours. Les classes 4 et 5 retiennent `asset` par défaut : un compte de
        tiers peut être créance ou dette, à la reprise de le préciser.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [general_account]
              properties:
                general_account:
                  type: object
                  required: [code, name]
                  properties:
                    code: { type: string, description: "3 à 8 chiffres." }
                    name: { type: string }
                    klass: { type: integer, minimum: 1, maximum: 7 }
                    nature: { type: string, enum: [asset, liability, equity, revenue, expense] }
                    reconcilable: { type: boolean }
                    active: { type: boolean }
      responses:
        "201": { description: Compte créé. }
        "200": { description: Compte existant retrouvé sur son code. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /general_accounts/{id}:
    get:
      tags: [Comptabilité]
      summary: Détail d'un compte général
      description: "S'adresse par le CODE (`/general_accounts/613313`) ou par l'identifiant technique."
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Compte. }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Comptabilité]
      summary: Modifier un compte général
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { general_account: { type: object } } }
      responses:
        "200": { description: Compte mis à jour. }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /analytic_accounts:
    get:
      tags: [Comptabilité]
      summary: Lister les axes analytiques
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: team_id, in: query, schema: { type: integer } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200": { description: Liste paginée d'axes analytiques. }
    post:
      tags: [Comptabilité]
      summary: Créer (ou retrouver) un axe analytique
      description: >
        UPSERT sur le code. `team_id` peut rester vide : le plan comptable du
        comptable connaît plus de pôles que claudy n'a d'équipes, et inventer
        l'équipe manquante produirait une hiérarchie que personne n'a décidée.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [analytic_account]
              properties:
                analytic_account:
                  type: object
                  required: [code, name]
                  properties:
                    code: { type: string }
                    name: { type: string }
                    team_id: { type: integer }
                    active: { type: boolean }
      responses:
        "201": { description: Axe créé. }
        "200": { description: Axe existant retrouvé sur son code. }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /analytic_accounts/{id}:
    patch:
      tags: [Comptabilité]
      summary: Modifier un axe analytique
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { analytic_account: { type: object } } }
      responses:
        "200": { description: Axe mis à jour. }

  /fiscal_years:
    get:
      tags: [Comptabilité]
      summary: Lister les exercices comptables
      parameters:
        - { name: legal_entity_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [open, closed] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200": { description: Liste paginée d'exercices. }
    post:
      tags: [Comptabilité]
      summary: Créer (ou retrouver) un exercice
      description: >
        UPSERT sur (entité, date de début). Sans exercice couvrant la date,
        aucune écriture ne peut être comptabilisée — c'est voulu. Un exercice
        clôturé sort en 409 : le rouvrir est une décision comptable, pas un effet
        de bord d'un import rejoué.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fiscal_year]
              properties:
                fiscal_year:
                  type: object
                  required: [legal_entity_id, starts_on, ends_on]
                  properties:
                    legal_entity_id: { type: integer }
                    starts_on: { type: string, format: date }
                    ends_on: { type: string, format: date }
                    status: { type: string, enum: [open, closed] }
      responses:
        "201": { description: Exercice créé. }
        "200": { description: Exercice existant retrouvé. }
        "409": { description: "Exercice clôturé." }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /fiscal_years/{id}:
    get:
      tags: [Comptabilité]
      summary: Détail d'un exercice
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Exercice. }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Comptabilité]
      summary: Modifier un exercice
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { fiscal_year: { type: object } } }
      responses:
        "200": { description: Exercice mis à jour. }
        "409": { description: "Exercice clôturé." }

  /opening_entries:
    get:
      tags: [Comptabilité]
      summary: Lister les écritures d'à-nouveau
      parameters:
        - { name: fiscal_year_id, in: query, schema: { type: integer } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200": { description: Liste paginée d'écritures d'ouverture. }
    post:
      tags: [Comptabilité]
      summary: Poser l'écriture d'à-nouveau d'un exercice
      description: >
        La SEULE écriture comptable que l'API pose. Tout le reste se génère
        depuis un document métier — une ouverture, elle, vient d'un bilan produit
        ailleurs. Refusée en 422 si les débits ne font pas les crédits, avec
        l'écart en clair : une ouverture qui ne balance pas contamine l'exercice
        entier. Un code de compte inconnu arrête tout, plutôt que de poser une
        ouverture amputée qui balancerait quand même. Reposter contre-passe
        l'ouverture précédente au lieu d'en empiler une seconde.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fiscal_year_id, lines]
              properties:
                fiscal_year_id: { type: integer }
                entry_date: { type: string, format: date, description: "Par défaut, le premier jour de l'exercice." }
                label: { type: string }
                lines:
                  type: array
                  items:
                    type: object
                    required: [general_account_code]
                    properties:
                      general_account_code: { type: string }
                      analytic_account_code: { type: string }
                      debit_cents: { type: integer }
                      credit_cents: { type: integer }
                      label: { type: string }
      responses:
        "201": { description: À-nouveau posé et numéroté. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: "Exercice clôturé." }
        "422": { description: "À-nouveau déséquilibré, ou compte inconnu." }

  /cash_accounts:
    get:
      tags: [Comptabilité]
      summary: Lister les comptes de trésorerie
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [bank, cash, stripe] } }
        - { name: active, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200": { description: Liste paginée de comptes de trésorerie. }
    post:
      tags: [Comptabilité]
      summary: Créer (ou retrouver) un compte de trésorerie
      description: >
        UPSERT sur le nom. Un import CODA refuse de créer le compte qu'il ne
        connaît pas — décider qu'un compte bancaire existe, et avec quelle
        contrepartie générale, n'appartient pas à un import de fichier. Le compte
        général s'adresse par son CODE, pas par son identifiant : un identifiant
        technique ne survit pas à une reprise de référentiel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cash_account]
              properties:
                cash_account:
                  type: object
                  required: [name, kind]
                  properties:
                    name: { type: string }
                    kind: { type: string, enum: [bank, cash, stripe] }
                    iban: { type: string }
                    legal_entity_id: { type: integer }
                    general_account_code: { type: string }
                    active: { type: boolean }
      responses:
        "201": { description: Compte créé. }
        "200": { description: Compte existant retrouvé sur son nom. }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /cash_accounts/{id}:
    get:
      tags: [Comptabilité]
      summary: Détail d'un compte de trésorerie
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Compte. }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Comptabilité]
      summary: Modifier un compte de trésorerie
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { cash_account: { type: object } } }
      responses:
        "200": { description: Compte mis à jour. }

  /coda_imports:
    get:
      tags: [Comptabilité]
      summary: Lister les dépôts CODA
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200": { description: Liste paginée de dépôts, avec leurs relevés. }
    post:
      tags: [Comptabilité]
      summary: Déposer un extrait CODA
      description: >
        Passe par le même service que l'écran, et de façon SYNCHRONE : un import
        bancaire qui échoue en silence dans un job est une panne qu'on découvre
        trois mois plus tard, à la clôture. Un fichier qui a déjà créé des
        lignes rend 200 avec le statut `already_imported` et ne crée rien —
        rejouer un import est une opération normale. Un dépôt antérieur qui
        n'avait rien créé, lui, est repris sur place. Deux fichiers qui se
        recouvrent n'importent chacun que leur part nouvelle : la déduplication
        porte sur le mouvement, jamais sur le numéro de relevé, que certaines
        banques n'incrémentent pas. Un fichier refusé rend 422 avec le motif :
        relevé qui ne se referme pas, chaînage rompu, ou compte inconnu. Le
        rapprochement du compte se fait sur les chiffres du numéro de compte, ce
        qui permet à une BBAN belge de retrouver son IBAN. Aucune allocation
        n'est créée : les lignes arrivent en attente, un humain ventile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                filename: { type: string }
                content: { type: string, description: "Le contenu du fichier CODA, en clair." }
      responses:
        "201": { description: Fichier importé. }
        "200": { description: "Fichier déjà déposé — rien créé." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: "Fichier refusé : le motif porte le relevé et l'écart chiffré." }
  /coda_imports/{id}:
    get:
      tags: [Comptabilité]
      summary: Détail d'un dépôt CODA
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Dépôt et ses relevés. }
        "404": { $ref: "#/components/responses/NotFound" }

  /cash_entries:
    get:
      tags: [Comptabilité]
      summary: Lister les lignes du journal de trésorerie
      parameters:
        - { name: cash_account_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [pending, allocated, excluded] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200": { description: Liste paginée de lignes, dans l'ordre chronologique. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Comptabilité]
      summary: Créer une ligne de trésorerie hors CODA
      description: >
        Pour ce que la banque ne raconte pas — une caisse en espèces ne produit
        aucun fichier CODA. La ligne arrive `pending` : l'affectation reste
        humaine. `external_ref` porte l'idempotence, et la base la garantit par
        un index unique sur (compte, référence) ; rejouer un import met donc à
        jour au lieu de créer une seconde ligne. Une ligne déjà comptabilisée
        sort en 409 : elle est gelée, et la correction passe par une
        contre-passation. Le compte s'adresse par son identifiant ou par son NOM.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cash_entry]
              properties:
                cash_entry:
                  type: object
                  required: [entry_date, amount_cents, label]
                  properties:
                    cash_account_id: { type: integer }
                    cash_account_name: { type: string, description: "Alternative à l'identifiant." }
                    entry_date: { type: string, format: date }
                    value_date: { type: string, format: date }
                    amount_cents: { type: integer, description: "Signé : positif = entrée, négatif = sortie. Zéro refusé." }
                    label: { type: string }
                    counterparty_name: { type: string }
                    communication: { type: string }
                    external_ref: { type: string }
      responses:
        "201": { description: Ligne créée. }
        "200": { description: Ligne retrouvée sur sa référence et mise à jour. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: "Ligne déjà comptabilisée, donc gelée." }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /cash_entries/{id}:
    get:
      tags: [Comptabilité]
      summary: Détail d'une ligne de trésorerie
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Ligne. }
        "404": { $ref: "#/components/responses/NotFound" }

  /paper_sheets:
    get:
      tags: [Bar & comptes internes]
      summary: Lister les fiches papier
      parameters:
        - { name: channel, in: query, schema: { type: string, enum: [bar, grocery, meal] } }
        - { name: status, in: query, schema: { type: string, enum: [open, encoded, archived] } }
        - { name: period_month, in: query, schema: { type: string, format: date }, description: "N'importe quelle date du mois visé." }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Liste paginée de fiches, de la plus récente à la plus ancienne.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PaperSheet" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Bar & comptes internes]
      summary: Créer une fiche papier (upsert sur mois + canal)
      description: >
        Il n'existe qu'une fiche de bar par mois : reposter le même couple
        (period_month, channel) retrouve la fiche existante. `period_month` est
        ramené au premier jour du mois. Les écritures qui en naîtront seront datées
        du DERNIER jour du mois.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paper_sheet:
                  type: object
                  required: [period_month, channel]
                  properties:
                    period_month: { type: string, format: date, example: "2026-07-01" }
                    channel: { type: string, enum: [bar, grocery, meal] }
                    entry_mode: { type: string, enum: [quantity, amount], default: quantity }
                    status: { type: string, enum: [open, encoded, archived] }
                    notes: { type: string, nullable: true }
      responses:
        "201":
          description: Fiche créée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PaperSheet" }
                  meta: { type: object, properties: { created: { type: boolean } } }
        "200":
          description: Fiche déjà existante, mise à jour.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /paper_sheets/{id}:
    get:
      tags: [Bar & comptes internes]
      summary: Détail d'une fiche, avec ses totaux par compte
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Fiche et répartition de son total par compte.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/PaperSheet" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Bar & comptes internes]
      summary: Éditer une fiche papier
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { $ref: "#/components/requestBodies/WriteBody" }
      responses:
        "200":
          description: Fiche mise à jour.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /paper_sheets/{id}/encode:
    post:
      tags: [Bar & comptes internes]
      summary: Encoder la matrice d'une fiche
      description: >
        Une cellule non vide = une écriture au grand livre. L'opération est
        REJOUABLE : chaque cellule porte une clé d'idempotence, donc réencoder la
        même fiche met ses écritures à jour au lieu d'en créer un second jeu, et
        mettre une cellule à zéro supprime la sienne. Une écriture déjà rattachée à
        un décompte émis n'est ni modifiée ni supprimée : elle est comptée dans
        `meta.encoding.locked` et sa cellule reste telle quelle.


        En mode `quantity`, la valeur de la cellule est multipliée par le prix
        sourcier qui couvre le dernier jour du mois de la fiche ; en mode `amount`,
        elle est prise comme un montant en euros.


        Les cellules sont adressées par IDENTIFIANT, jamais par nom : passer par
        /member_accounts?q= et /catalog_items?q= pour résoudre les noms d'abord.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cells]
              properties:
                entry_mode: { type: string, enum: [quantity, amount] }
                cells:
                  type: object
                  description: "{ \"<member_account_id>\": { \"<catalog_item_id>\": quantité } }"
                  additionalProperties:
                    type: object
                    additionalProperties: { type: number }
                  example: { "12": { "45": 3, "46": 1 }, "13": { "45": 2 } }
      responses:
        "200":
          description: Fiche encodée, avec le rapport dans `meta.encoding` et les totaux par compte.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PaperSheet" }
                  meta:
                    type: object
                    properties:
                      encoding:
                        type: object
                        properties:
                          created: { type: integer }
                          updated: { type: integer }
                          deleted: { type: integer }
                          locked: { type: integer, description: "Cellules laissées telles quelles car verrouillées par un décompte émis." }
                          ignored: { type: integer, description: "Cellules dont l'article n'appartient pas au canal de la fiche." }
                          summary: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /allocation_rules:
    get:
      tags: [Comptabilité]
      summary: Lister les règles d'affectation
      parameters:
        - { name: direction, in: query, schema: { type: string, enum: [incoming, outgoing] } }
        - { name: active, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200": { description: Liste paginée de règles, dans l'ordre d'application. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Comptabilité]
      summary: Créer (ou retrouver) une règle d'affectation
      description: >
        UPSERT sur le LIBELLÉ. Une règle PROPOSE une affectation motivée, elle
        ne comptabilise jamais : l'acceptation des suggestions n'est pas exposée
        par l'API et reste devant un humain. L'ORDRE compte — la première règle
        qui correspond gagne, ce qui permet de poser un garde très précis avant
        une règle générale. Une règle sans aucun critère est refusée : elle
        s'appliquerait à tout. Les critères textuels sont des SOUS-CHAÎNES
        insensibles à la casse, sans ancrage — `bar` reconnaît « Cabaronde ».
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allocation_rule]
              properties:
                allocation_rule:
                  type: object
                  required: [label]
                  properties:
                    label: { type: string, description: "Clé d'upsert." }
                    position: { type: integer, description: "Ordre d'application ; le plus petit gagne." }
                    confidence: { type: integer, minimum: 0, maximum: 100 }
                    active: { type: boolean }
                    direction: { type: string, enum: [incoming, outgoing] }
                    counterparty_iban: { type: string }
                    counterparty_name_contains: { type: string }
                    communication_contains: { type: string }
                    transaction_code: { type: string }
                    min_amount_cents: { type: integer }
                    max_amount_cents: { type: integer }
                    general_account_code: { type: string, description: "Le compte proposé, adressé par son code." }
                    team_name: { type: string }
                    legal_entity_name: { type: string }
                    general_account_id: { type: integer }
                    analytic_account_code: { type: string }
                    team_id: { type: integer }
                    legal_entity_id: { type: integer }
                    event_id: { type: integer }
      responses:
        "201": { description: Règle créée. }
        "200": { description: Règle existante retrouvée sur son libellé. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /allocation_rules/{id}:
    get:
      tags: [Comptabilité]
      summary: Détail d'une règle d'affectation
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Règle. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Comptabilité]
      summary: Modifier une règle d'affectation
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { allocation_rule: { type: object } } }
      responses:
        "200": { description: Règle mise à jour. }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [Comptabilité]
      summary: Supprimer une règle d'affectation
      description: "Suppression douce ; les suggestions déjà produites restent, détachées de la règle."
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Règle supprimée. }
        "404": { $ref: "#/components/responses/NotFound" }

  /cash_motifs:
    get:
      tags: [Comptabilité]
      summary: Lister les motifs de caisse
      parameters:
        - { name: direction, in: query, schema: { type: string, enum: [in, out, both] } }
        - { name: active, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200": { description: Liste paginée de motifs, dans l'ordre de saisie. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Comptabilité]
      summary: Créer (ou retrouver) un motif de caisse
      description: >
        UPSERT sur le LIBELLÉ, que le modèle impose déjà unique. LE MOTIF EST
        L'AFFECTATION : il porte le compte général, le pôle et l'entité, et la
        ligne de caisse en prend une COPIE à la saisie. Réaffecter un motif ne
        réécrit donc AUCUNE ligne déjà saisie — l'écriture ici est sans effet
        sur un exercice en cours. Un motif sans compte général est refusé.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cash_motif]
              properties:
                cash_motif:
                  type: object
                  required: [label]
                  properties:
                    label: { type: string, description: "Clé d'upsert." }
                    direction: { type: string, enum: [in, out, both], description: "`in` fait entrer l'argent, `out` le fait sortir ; le signe du montant en découle." }
                    position: { type: integer }
                    active: { type: boolean }
                    general_account_code: { type: string }
                    team_name: { type: string }
                    legal_entity_name: { type: string }
                    general_account_id: { type: integer }
                    team_id: { type: integer }
                    legal_entity_id: { type: integer }
      responses:
        "201": { description: Motif créé. }
        "200": { description: Motif existant retrouvé sur son libellé. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /cash_motifs/{id}:
    get:
      tags: [Comptabilité]
      summary: Détail d'un motif de caisse
      description: "S'adresse par le LIBELLÉ (`/cash_motifs/Bar`) ou par l'identifiant technique."
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Motif. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Comptabilité]
      summary: Modifier un motif de caisse
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { cash_motif: { type: object } } }
      responses:
        "200": { description: Motif mis à jour. }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # ── Échéancier comptable ────────────────────────────────────────────────────
  /compliance_obligations:
    get:
      tags: [Comptabilité]
      summary: Lister les obligations de l'échéancier comptable
      parameters:
        - { name: legal_entity_name, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200": { description: Liste paginée d'obligations, chacune avec ses échéances. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Comptabilité]
      summary: Créer (ou retrouver) une obligation
      description: >
        UPSERT sur le couple (title, entité). Chaque écriture régénère les
        échéances de la règle jusqu'à douze mois devant : la réponse les liste.
        Une échéance existante n'est jamais réécrite. `first_due_on` est la
        PREMIÈRE échéance à suivre ; les suivantes s'en déduisent par pas de 1,
        3 ou 12 mois. `covers` dit quelle période chaque échéance couvre
        (`previous` : TVA d'avril → T1 ; `current` : précompte d'octobre →
        l'année). Sans responsable, les rappels vont aux destinataires comptables
        des réglages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [compliance_obligation]
              properties:
                compliance_obligation:
                  type: object
                  required: [title, first_due_on]
                  properties:
                    title: { type: string, description: "Sans la période (« Déclaration TVA »). Clé d'upsert avec l'entité." }
                    legal_entity_name: { type: string, description: "Nom exact de l'entité ; ou `legal_entity_id`." }
                    legal_entity_id: { type: integer }
                    frequency: { type: string, enum: [once, monthly, quarterly, yearly] }
                    first_due_on: { type: string, format: date }
                    ends_on: { type: string, format: date }
                    covers: { type: string, enum: [previous, current] }
                    payment: { type: boolean, description: "Paiement : l'échéance se solde par une facture d'achat liée." }
                    responsible_email: { type: string, description: "Reçoit les rappels ; ou `responsible_user_id`." }
                    responsible_user_id: { type: integer }
                    instructions: { type: string, description: "Mode opératoire." }
                    active: { type: boolean }
      responses:
        "201": { description: Obligation créée, échéances générées. }
        "200": { description: Obligation existante retrouvée et mise à jour. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /compliance_obligations/{id}:
    get:
      tags: [Comptabilité]
      summary: Détail d'une obligation et de ses échéances
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Obligation. }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Comptabilité]
      summary: Modifier une obligation (régénère ses échéances)
      description: >
        Une échéance future que la règle ne produit plus est retirée SEULEMENT si
        personne n'y a touché (ni note, ni preuve, ni facture, ni état).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { compliance_obligation: { type: object } } }
      responses:
        "200": { description: Obligation mise à jour. }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /compliance_deadlines:
    get:
      tags: [Comptabilité]
      summary: Lister les échéances
      parameters:
        - { name: compliance_obligation_id, in: query, schema: { type: integer } }
        - { name: outstanding, in: query, schema: { type: boolean }, description: "Seulement les échéances ouvertes (ni closes, ni soldées par leur facture)." }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200": { description: Liste paginée, par date limite. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /compliance_deadlines/{id}:
    get:
      tags: [Comptabilité]
      summary: Détail d'une échéance
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Échéance. `effective_status` vaut `done` dès que la facture liée est payée. }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Comptabilité]
      summary: Clore, reporter ou annoter une échéance
      description: >
        Pas de POST : une échéance naît de sa règle. Pour reprendre l'historique,
        passer `status: done` et `done_on` à la date réelle du dépôt.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                compliance_deadline:
                  type: object
                  properties:
                    due_on: { type: string, format: date }
                    status: { type: string, enum: [todo, in_progress, done, not_applicable] }
                    done_on: { type: string, format: date }
                    note: { type: string }
                    purchase_invoice_id: { type: integer, description: "Seulement pour une échéance de paiement." }
      responses:
        "200": { description: Échéance mise à jour. }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # ── Carte du domaine et plantes nourricières (epic #348, phase 8) ──────────
  /plant_species:
    get:
      tags: [Carte & plantes]
      summary: Lister les espèces nourricières
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Recherche sur le nom ou le nom latin." }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Liste paginée d'espèces, avec leurs fenêtres de récolte par défaut et leurs variétés.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PlantSpecies" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Carte & plantes]
      summary: Créer une espèce (upsert sur le nom, casse ignorée)
      description: >
        Reposter une espèce du même nom (« pommier » = « Pommier ») met sa fiche à
        jour au lieu d'échouer. `meta.created` dit si elle a été créée.
        `harvest_windows`, s'il est donné, REMPLACE les fenêtres par défaut de
        l'espèce (liste vide = aucune).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plant_species: { $ref: "#/components/schemas/PlantSpeciesInput" }
      responses:
        "201": { $ref: "#/components/responses/PlantSpeciesCreated" }
        "200": { $ref: "#/components/responses/PlantSpeciesCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /plant_species/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Carte & plantes]
      summary: Détail d'une espèce
      responses:
        "200": { $ref: "#/components/responses/PlantSpeciesCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Carte & plantes]
      summary: Modifier une espèce (fiche botanique, fenêtres par défaut)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plant_species: { $ref: "#/components/schemas/PlantSpeciesInput" }
      responses:
        "200": { $ref: "#/components/responses/PlantSpeciesCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /plant_varieties:
    get:
      tags: [Carte & plantes]
      summary: Lister les variétés
      parameters:
        - { name: plant_species_id, in: query, schema: { type: integer }, description: "Les variétés de cette espèce." }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Liste paginée de variétés.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PlantVariety" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Carte & plantes]
      summary: Créer une variété (upsert sur espèce + nom)
      description: L'espèce se donne par `plant_species_id` ou par `species_name` (créée au besoin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plant_variety:
                  type: object
                  required: [name]
                  properties:
                    plant_species_id: { type: integer }
                    species_name: { type: string, example: "Pommier" }
                    name: { type: string, example: "Reinette Hernaut" }
                    notes: { type: string, nullable: true }
      responses:
        "201": { $ref: "#/components/responses/PlantVarietyCreated" }
        "200": { $ref: "#/components/responses/PlantVarietyCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /plant_varieties/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Carte & plantes]
      summary: Détail d'une variété
      responses:
        "200": { $ref: "#/components/responses/PlantVarietyCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /plants:
    get:
      tags: [Carte & plantes]
      summary: Lister les plantes
      parameters:
        - { name: status, in: query, schema: { type: string }, description: "Un statut ou plusieurs séparés par des virgules (clés de PlantStatus)." }
        - { name: zone, in: query, schema: { type: string }, example: "Verger" }
        - { name: placed, in: query, schema: { type: boolean }, description: "true = placées sur la carte, false = à placer." }
        - { name: q, in: query, schema: { type: string }, description: "Nom, numéro (« 9.1 », « #42 »), espèce, nom latin, variété." }
        - { name: number, in: query, schema: { type: string }, example: "9.1", description: "Numéro exact." }
        - { name: plant_species_id, in: query, schema: { type: integer } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Liste paginée de plantes, par numéro puis nom.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Plant" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Carte & plantes]
      summary: Créer une plante (upsert sur notion_url)
      description: >
        Le chemin de l'import Notion. Si `notion_url` est donné et qu'une plante le
        porte déjà, elle est mise à jour (`meta.created` = false) : rejouer un
        import ne double rien. `species_name` / `variety_name` sont résolus (créés
        au besoin). `latitude` + `longitude` placent la plante (point dans la
        couche Plantes) ; sans eux, elle est « à placer ». Numéro déjà pris ou
        valeur hors liste fermée → 422 qui dit laquelle et liste les valeurs admises.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plant]
              properties:
                plant: { $ref: "#/components/schemas/PlantInput" }
      responses:
        "201": { $ref: "#/components/responses/PlantDetail" }
        "200": { $ref: "#/components/responses/PlantDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /plants/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Carte & plantes]
      summary: Fiche d'une plante (avec notes datées, photos et tâches)
      responses:
        "200": { $ref: "#/components/responses/PlantDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Carte & plantes]
      summary: Modifier une plante
      description: >
        Mêmes champs que la création. `latitude` + `longitude` déplacent la plante ;
        `placed: false` la retire de la carte (elle redevient « à placer ») ;
        `harvest_windows` remplace ses fenêtres propres (liste vide = retour à
        l'héritage de l'espèce).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plant: { $ref: "#/components/schemas/PlantInput" }
      responses:
        "200": { $ref: "#/components/responses/PlantDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [Carte & plantes]
      summary: Supprimer une plante (suppression douce, son point disparaît de la carte)
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /plants/{plant_id}/notes:
    parameters:
      - { name: plant_id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Carte & plantes]
      summary: Ajouter une note datée à une plante
      requestBody: { $ref: "#/components/requestBodies/MapNoteBody" }
      responses:
        "201": { $ref: "#/components/responses/MapNoteDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /plants/{plant_id}/photos:
    parameters:
      - { name: plant_id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Carte & plantes]
      summary: Ajouter des photos à une plante
      requestBody: { $ref: "#/components/requestBodies/PhotosUpload" }
      responses:
        "201": { $ref: "#/components/responses/PhotosCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /plants/{plant_id}/photos/{id}:
    parameters:
      - { name: plant_id, in: path, required: true, schema: { type: integer } }
      - { $ref: "#/components/parameters/Id" }
    delete:
      tags: [Carte & plantes]
      summary: Retirer une photo d'une plante (définitif)
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /map_features:
    get:
      tags: [Carte & plantes]
      summary: Lister les objets de la carte
      parameters:
        - { name: layer_id, in: query, schema: { type: integer } }
        - { name: layer_kind, in: query, schema: { $ref: "#/components/schemas/MapLayerKind" } }
        - { name: kind, in: query, schema: { type: string }, description: "feature_kind, un ou plusieurs séparés par des virgules (clés de MapFeatureKind)." }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Liste paginée d'objets de la carte.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MapFeature" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Carte & plantes]
      summary: Créer un objet de la carte
      description: >
        La couche se donne par `layer_id` ou `layer_kind` (couches uniques
        seulement). Sans `feature_kind`, la géométrie le dit (Polygon → zone,
        LineString → path, Point → point). Un point de plante ne se crée pas ici :
        voir POST /plants.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                map_feature: { $ref: "#/components/schemas/MapFeatureInput" }
      responses:
        "201": { $ref: "#/components/responses/MapFeatureDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /map_features/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Carte & plantes]
      summary: Détail d'un objet de la carte (avec notes datées, photos et tâches)
      responses:
        "200": { $ref: "#/components/responses/MapFeatureDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Carte & plantes]
      summary: Modifier un objet de la carte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                map_feature: { $ref: "#/components/schemas/MapFeatureInput" }
      responses:
        "200": { $ref: "#/components/responses/MapFeatureDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [Carte & plantes]
      summary: Supprimer un objet de la carte (suppression douce ; un point de plante rend sa plante « à placer »)
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /map_features/{map_feature_id}/notes:
    parameters:
      - { name: map_feature_id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Carte & plantes]
      summary: Ajouter une note datée à un objet de la carte
      requestBody: { $ref: "#/components/requestBodies/MapNoteBody" }
      responses:
        "201": { $ref: "#/components/responses/MapNoteDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /map_features/{map_feature_id}/photos:
    parameters:
      - { name: map_feature_id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Carte & plantes]
      summary: Ajouter des photos à un objet de la carte
      requestBody: { $ref: "#/components/requestBodies/PhotosUpload" }
      responses:
        "201": { $ref: "#/components/responses/PhotosCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /map_features/{map_feature_id}/photos/{id}:
    parameters:
      - { name: map_feature_id, in: path, required: true, schema: { type: integer } }
      - { $ref: "#/components/parameters/Id" }
    delete:
      tags: [Carte & plantes]
      summary: Retirer une photo d'un objet de la carte (définitif)
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /map_notes/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    patch:
      tags: [Carte & plantes]
      summary: Modifier une note datée
      requestBody: { $ref: "#/components/requestBodies/MapNoteBody" }
      responses:
        "200": { $ref: "#/components/responses/MapNoteDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [Carte & plantes]
      summary: Supprimer une note datée (suppression douce)
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /map_tasks:
    get:
      tags: [Carte & plantes]
      summary: Lister les tâches de gestion de la carte
      parameters:
        - { name: subject_type, in: query, schema: { $ref: "#/components/schemas/MapSubjectType" } }
        - { name: subject_id, in: query, schema: { type: integer } }
        - { name: month, in: query, schema: { type: integer, minimum: 1, maximum: 12 } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Liste paginée de tâches dont le porteur est vivant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MapTask" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Carte & plantes]
      summary: Créer une tâche sur une plante ou un objet de la carte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                map_task:
                  allOf:
                    - $ref: "#/components/schemas/MapTaskInput"
                    - type: object
                      required: [subject_type, subject_id, label]
                      properties:
                        subject_type: { $ref: "#/components/schemas/MapSubjectType" }
                        subject_id: { type: integer }
      responses:
        "201": { $ref: "#/components/responses/MapTaskDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /map_tasks/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Carte & plantes]
      summary: Détail d'une tâche
      responses:
        "200": { $ref: "#/components/responses/MapTaskDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Carte & plantes]
      summary: Modifier une tâche (le porteur ne change pas)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                map_task: { $ref: "#/components/schemas/MapTaskInput" }
      responses:
        "200": { $ref: "#/components/responses/MapTaskDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [Carte & plantes]
      summary: Supprimer une tâche (suppression douce)
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Jeton statique partagé, transmis en header `Authorization: Bearer <token>`."
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1 }
      description: Numéro de page (pagination).
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, default: 50, maximum: 200 }
      description: Éléments par page (max 200).
    CatalogItemId:
      name: catalog_item_id
      in: path
      required: true
      schema: { type: integer }
    PriceOn:
      name: on
      in: query
      schema: { type: string, format: date }
      description: >
        Date à laquelle résoudre le prix (défaut : aujourd'hui). Relire un mois
        clôturé sans ce paramètre afficherait les prix d'aujourd'hui.
  responses:
    PlantSpeciesCreated:
      description: Une espèce. `meta.created` (POST seulement) dit si elle a été créée.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/PlantSpecies" }
              meta: { type: object, properties: { created: { type: boolean } } }
    PlantVarietyCreated:
      description: Une variété. `meta.created` (POST seulement) dit si elle a été créée.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/PlantVariety" }
              meta: { type: object, properties: { created: { type: boolean } } }
    PlantDetail:
      description: La fiche d'une plante. `meta.created` (POST seulement) dit si elle a été créée.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/PlantDetail" }
              meta: { type: object, properties: { created: { type: boolean } } }
    MapFeatureDetail:
      description: Un objet de la carte, avec ses notes datées, photos et tâches.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/MapFeatureDetail" }
    MapNoteDetail:
      description: Une note datée.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/MapNote" }
    MapTaskDetail:
      description: Une tâche de gestion de la carte.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/MapTask" }
    PhotosCreated:
      description: Les photos CRÉÉES par cet envoi (pas celles qui existaient déjà).
      content:
        application/json:
          schema:
            type: object
            properties:
              photos: { type: array, items: { $ref: "#/components/schemas/Photo" } }
    Unauthorized:
      description: Jeton manquant ou invalide.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Ressource introuvable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Paramètres invalides.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoContent:
      description: Suppression effectuée (soft-delete). Pas de corps de réponse.
  requestBodies:
    MapNoteBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              map_note:
                type: object
                properties:
                  body: { type: string, example: "Bourgeons gelés" }
                  noted_on: { type: string, format: date, description: "Par défaut : aujourd'hui." }
    PhotosUpload:
      required: true
      description: >
        multipart/form-data, un ou plusieurs fichiers sous `photos[]`. JPEG ou PNG
        (HEIC si le serveur sait le convertir) ; un seul fichier refusé refuse tout
        l'envoi (422), rien n'est attaché.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [photos]
            properties:
              photos:
                type: array
                items: { type: string, format: binary }
    WriteBody:
      required: true
      description: >
        Champs à modifier, encapsulés sous la clé racine de la ressource
        (ex. { "booking": { "status": "confirmed" } }). Seuls les champs éditables
        sont pris en compte ; id, type et champs calculés sont ignorés. Voir le schéma
        de lecture de la ressource pour la liste des champs.
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: object
              additionalProperties: true
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
        messages: { type: array, items: { type: string }, description: "Messages de validation (422)." }
    Money:
      type: object
      properties:
        cents: { type: integer, nullable: true, description: "Montant en centimes." }
        currency: { type: string, example: "EUR" }
        formatted: { type: string, nullable: true, example: "1.250,00 €" }
    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        pages: { type: integer }
    Ref:
      type: object
      description: Référence légère vers une autre ressource.
      properties:
        id: { type: integer }
        name: { type: string }
    Customer:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, example: "customer" }
        customer_type: { type: string, enum: [individual, organization] }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        organization_name: { type: string, nullable: true }
        name: { type: string, description: "Nom d'affichage calculé." }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        language: { type: string, example: "fr" }
        vat_number: { type: string, nullable: true }
